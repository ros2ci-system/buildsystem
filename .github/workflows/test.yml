# This workflow only starts the tests. What the tests are is defined by
# ci/Dockerfile.test, so they run the same way on any machine with a
# container runtime and can move to another service unchanged.

name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build the test image
        run: docker build -f ci/Dockerfile.test -t buildsystem-test .
      - name: Start a PostgreSQL server for the database tests
        run: |
          docker run -d --name test-postgres --network host \
            -e POSTGRES_PASSWORD=test docker.io/library/postgres:17
          for i in $(seq 1 60); do
            docker exec test-postgres pg_isready -q -h 127.0.0.1 && break
            sleep 1
          done
      - name: Run the tests, including those that need a service
        run: >
          docker run --rm --network host
          -v /var/run/docker.sock:/var/run/docker.sock
          -e CI_CONTAINER_RUNTIME=unix:///var/run/docker.sock
          -e CI_POSTGRES_URL=postgres://postgres:test@127.0.0.1:5432/postgres
          buildsystem-test

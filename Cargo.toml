[workspace]
resolver = "2"
members = [
    "crates/crypto",
    "crates/json",
    "crates/tar",
    "crates/http",
    "crates/net",
    "crates/container",
    "crates/postgres",
    "crates/agent",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
panic = "abort"
